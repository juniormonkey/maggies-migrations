name: Sync Discord Sightings

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Discord channel to Google Sheet & photos
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GSHEET_WEBHOOK_SECRET: ${{ secrets.GSHEET_WEBHOOK_SECRET }}
          DISCORD_CHANNEL_ID: '1493308738755625060'
        run: python scripts/sync_discord.py

      - name: Commit updated photos and static cache
        run: |
          if [ -n "$(git status --porcelain docs/photos docs/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/photos docs/data
            git commit -m "chore: sync Maggie sightings"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
